# Memory-tuned for this aarch64 proot sandbox. Two hard constraints:
#   1. the shell carries `ulimit -v 2097152` — a 2 GiB *virtual address space*
#      cap that cannot be raised (`prlimit`: Operation not permitted);
#   2. only ~1.8 GiB of RAM is actually free.
# A default Gradle JVM reserves 1 GiB of compressed class space + 1 GiB heap +
# 240 MiB code cache before doing any work, so it dies immediately with
# "Could not allocate compressed class space" or
# "Native memory allocation (malloc) failed ... Chunk::new".
# Measured: with the flags below a JVM settles at ~1.3 GiB VmSize, which fits,
# and `-XX:ActiveProcessorCount=2` avoids the ~60-native-thread ceiling this
# container imposes on a single process.
# See docs/analysis/arch/ENVIRONMENT.md §6.
#
# CI does not read this comment block; it is purely local ergonomics.
org.gradle.jvmargs=-Xms64m -Xmx384m -XX:MaxMetaspaceSize=224m -XX:ReservedCodeCacheSize=48m -XX:-UseCompressedClassPointers -XX:+UseSerialGC -XX:ActiveProcessorCount=2 -Xss512k -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official

# Android / AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
