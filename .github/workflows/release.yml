name: release

# Publishes the sideload APK. Trigger it by pushing a version tag
# (`git push origin v0.2.8`) or run it manually with the version to publish.
# The debug APK is signed with the committed debug.keystore, so the released
# build installs over the previously released one as a normal upgrade.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.2.8'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: build + publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |-
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Resolve + verify version
        id: ver
        run: |-
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME}"; fi
          VERSION="${VERSION#v}"
          APP_VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "::error::tag/input '$VERSION' does not match app versionName '$APP_VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Stage + verify release APK
        run: |-
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p dist
          OUT="dist/lumen-$VERSION-debug.apk"
          cp "$APK" "$OUT"

          # The package id must never change and the version must be the one we
          # publish, or the APK will not install over the previous release.
          BADGING="$("$BT/aapt2" dump badging "$OUT")"
          echo "$BADGING" | grep -q "package: name='dev.lumen.app'" \
            || { echo "::error::unexpected package id"; exit 1; }
          echo "$BADGING" | grep -q "versionName='$VERSION'" \
            || { echo "::error::APK versionName is not $VERSION"; exit 1; }

          # Same signing certificate as every earlier release, so Android treats
          # this as an in-place upgrade rather than a conflicting package.
          EXPECTED=aea42858c6ff0ab72ccb866d76064e62a2c4a53cdc98339ad084dff21918c68c
          "$BT/apksigner" verify --print-certs "$OUT" > certs.txt
          grep -qi "certificate SHA-256 digest: $EXPECTED" certs.txt \
            || { echo "::error::APK is not signed with the committed debug keystore"; cat certs.txt; exit 1; }
          "$BT/apksigner" verify "$OUT"

          echo "APK ok: $(ls -lh "$OUT" | awk '{print $5}')"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumen-release-apk
          path: dist/*.apk
          if-no-files-found: ignore

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |-
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/lumen-$VERSION-debug.apk" --clobber
          else
            gh release create "$TAG" "dist/lumen-$VERSION-debug.apk" \
              --target "$GITHUB_SHA" \
              --title "Lumen $VERSION" \
              --notes "Sideload APK for Lumen $VERSION. Installs over the previous release (same package \`dev.lumen.app\`, higher versionCode, same debug signing key)."
          fi
          gh release view "$TAG" --json url,tagName,assets \
            --jq '"released \(.tagName): \(.url)\nassets: \([.assets[].name] | join(", "))"'
